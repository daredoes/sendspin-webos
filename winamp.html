<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sendspin Cinema · Winamp</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
        #art {
            position: fixed; inset: -10%; background-size: cover; background-position: center;
            filter: blur(80px) brightness(0.35) saturate(1.2); transition: background-image 1s;
        }
        #app { position: fixed; inset: 0; }
        #hint {
            position: fixed; bottom: 24px; width: 100%; text-align: center;
            font: 20px sans-serif; color: rgba(255,255,255,0.45);
        }
    </style>
</head>
<body>
    <div id="art"></div>
    <div id="app"></div>
    <div id="hint">Back: cinema view · ◀ ▶ previous / next · OK: play / pause</div>
    <script src="vendor/webamp.bundle.js"></script>
    <script src="winamp.js"></script>
</body>
</html>
